# End to end on a real Mac, the way a student meets Butler: install with the one-line installer
# (from this checkout), the first preview, the Calendar helper build, the launchd templates.
# Weekly, the real hosted installer runs against GitHub main too.
name: macos-e2e

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  e2e:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: tests/e2e/macos.sh
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: The test suite on macOS
        run: python -m unittest discover tests
        env:
          PYTHONPATH: src
      - name: Open an issue when a scheduled run fails
        if: failure() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/report-failure.sh

  hosted-installer:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: tests/e2e/macos.sh --hosted
      - name: Open an issue when a scheduled run fails
        if: failure() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/report-failure.sh
