# End to end on a real Mac, the way a student meets Butler: install with the one-line installer
# (from this checkout), the first preview, the Calendar helper build, the launchd templates.
# Weekly, the real hosted installer runs against GitHub main too.
name: macos-e2e

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  e2e:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: tests/e2e/macos.sh
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install --require-hashes -r requirements.lock && pip install -r requirements-dev.txt
      - name: The test suite on macOS
        run: python -m unittest discover tests
        env:
          PYTHONPATH: src
      - name: Open an issue when a scheduled run fails
        if: failure() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/report-failure.sh

  package:
    # The download students get: build the universal helper and an unsigned package, check them,
    # then install it into this runner's home the way Installer does and check what landed.
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install --require-hashes -r requirements.lock && pip install -r requirements-dev.txt
      - name: Package tests (names, postinstall, the built package)
        run: |
          python -m unittest discover -v -s tests -p test_packaging.py
          python -m unittest discover -v -s tests -p test_first_run.py
        env:
          PYTHONPATH: src
      - name: Build the helper, the Butler app and the package
        run: |
          packaging/macos/build-helper.sh "$RUNNER_TEMP/butler-ek"
          [ "$(lipo -archs "$RUNNER_TEMP/butler-ek")" = "x86_64 arm64" ]
          packaging/macos/build-app.sh "$RUNNER_TEMP/Butler.app" v0.0.0-ci
          pkg="$(packaging/macos/build-pkg.sh --version v0.0.0-ci --out "$RUNNER_TEMP/dist" --helper "$RUNNER_TEMP/butler-ek" --app "$RUNNER_TEMP/Butler.app")"
          cp "$pkg" "$RUNNER_TEMP/Bento (1).pkg"
      - name: Install it as a student would, into the home folder, without admin rights
        run: |
          installer -pkg "$RUNNER_TEMP/Bento (1).pkg" -target CurrentUserHomeDirectory
          b="$HOME/Butler"
          test -x "$b/bin/butler"
          test -x "$b/bin/butler-ek"
          test -x "$b/scripts/first-run.command"
          [ "$(cat "$b/.butler-name")" = "Bento" ]
          [ "$(cat "$b/.butler-version")" = "v0.0.0-ci" ]
          [ "$(stat -f %Su "$b/bin/butler")" = "$(id -un)" ]
          test ! -e "$b/config/settings.yaml"
          out="$("$b/bin/butler" status || true)"
          echo "$out" | grep -q "butler setup"
          # This runner's account is an admin: the Butler app goes to /Applications, with no copy left behind.
          test -x /Applications/Butler.app/Contents/MacOS/Butler
          test ! -e "$HOME/Applications/Butler.app"
          grep "the Butler app is in /Applications" "$b/logs/install.log"
      - name: The installer opens Terminal in the logged-in session, as Installer.app runs it; the Butler app resumes
        run: tests/e2e/installer-opens.sh "$RUNNER_TEMP/Bento (1).pkg"
      - name: Upgrading keeps the household's files
        run: |
          b="$HOME/Butler"
          # Each check says what failed, with what it found (#37: this step failed now and then
          # without saying which check).
          check() { local what="$1"; shift; "$@" || { echo "::error::upgrade: $what"; ps -axo pid,command | grep -E "Butler|Terminal|first-run|bootstrap" | grep -v grep; for f in config/settings.yaml data/household_notes.md .butler-name; do echo "--- $f"; cat "$b/$f" 2>&1; done; tail -n 20 "$b/logs/install.log" "$b/logs/setup.log" 2>&1; exit 1; }; }
          # Nothing the step before started may still be writing in the Butler folder.
          pkill -x Terminal || true
          pkill -f "$b/scripts/" || true
          for _ in $(seq 20); do pgrep -f "$b/scripts/" >/dev/null || pgrep -x Terminal >/dev/null || break; sleep 1; done
          printf 'name: Bento\n' > "$b/config/settings.yaml"
          mkdir -p "$b/data" && echo "- a note" > "$b/data/household_notes.md"
          cp "$RUNNER_TEMP/Bento (1).pkg" "$RUNNER_TEMP/Jeeves.pkg"
          installer -pkg "$RUNNER_TEMP/Jeeves.pkg" -target CurrentUserHomeDirectory
          check "settings.yaml changed" test "$(cat "$b/config/settings.yaml")" = "name: Bento"
          check "household_notes.md changed" test "$(cat "$b/data/household_notes.md")" = "- a note"
          check ".butler-name changed" test "$(cat "$b/.butler-name")" = "Bento"
          # The upgrade kept the app current where it was: in /Applications, replaced in place.
          tail -n 3 "$b/logs/install.log"
          grep -q "the Butler app is in /Applications (replaced the older one, from ~/Applications)" "$b/logs/install.log"
          test -x /Applications/Butler.app/Contents/MacOS/Butler
          test ! -e "$HOME/Applications/Butler.app"
          codesign --verify --strict /Applications/Butler.app

  updates:
    # Over-the-air updates with the real Installer: v0.0.1 → v0.0.2 keeps the household's files
    # and runs the migration; a broken v0.0.3 rolls back; an unsigned v0.0.4 is refused.
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - run: tests/e2e/update.sh

  hosted-installer:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: tests/e2e/macos.sh --hosted
      - name: Open an issue when a scheduled run fails
        if: failure() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/report-failure.sh
