name: scratch-mac-probe
on:
  push:
    branches: [e2e/mac-standard-user]
jobs:
  probe:
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: probe
        run: |
          pw="$(openssl rand -base64 18)"
          sudo sysadminctl -addUser bybtest -fullName "BYB Test" -password "$pw" -home "/Users/byb test" >/dev/null 2>&1
          sudo createhomedir -c -u bybtest
          sudo sysadminctl -addUser admintwo -fullName "Admin Two" -password "$pw" -home "/Users/admintwo" -admin >/dev/null 2>&1
          sudo createhomedir -c -u admintwo
          set -x; set +e
          u=$(id -u bybtest); a=$(id -u admintwo)
          h="/Users/byb test"
          packaging/macos/build-pkg.sh --version v0.0.1 --out /tmp/pk | tail -1
          sudo mkdir -p /Users/Shared/byb && sudo cp /tmp/pk/*.pkg "/Users/Shared/byb/Bento.pkg" && sudo chmod -R a+rwX /Users/Shared/byb && sudo chmod 777 /Users/Shared/byb
          il() { sudo grep -E "installd: uid|Adding client|Install Failed|Error relinking|Permission denied|Shoving|Install Succeeded|Running install actions|Finalize|PKInstallErrorDomain" /var/log/install.log | tail -n "${1:-12}" | cut -c1-260; }
          job() {  # job <user> <uid> <label>: installer from a launchd job in the user's background domain
            local home; home="$(dscl . -read /Users/$1 NFSHomeDirectory | sed 's/^NFSHomeDirectory: //')"
            sudo -u $1 mkdir -p "$home/Library/LaunchAgents"
            printf '%s\n' '<?xml version="1.0" encoding="UTF-8"?>' \
              '<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">' \
              "<plist version=\"1.0\"><dict><key>Label</key><string>$3</string>" \
              '<key>LimitLoadToSessionType</key><string>Background</string>' \
              '<key>ProgramArguments</key><array><string>/bin/sh</string><string>-c</string><string>/usr/sbin/installer -pkg /Users/Shared/byb/Bento.pkg -target CurrentUserHomeDirectory; echo installer-in-launchd $?</string></array>' \
              '<key>RunAtLoad</key><true/>' \
              "<key>StandardOutPath</key><string>/Users/Shared/byb/$3.out</string><key>StandardErrorPath</key><string>/Users/Shared/byb/$3.out</string></dict></plist>" > /tmp/$3.plist
            sudo -u $1 cp /tmp/$3.plist "$home/Library/LaunchAgents/$3.plist"
            sudo -u $1 launchctl bootstrap user/$2 "$home/Library/LaunchAgents/$3.plist"; echo "bootstrap exit $?"
            for i in $(seq 60); do grep -q installer-in-launchd /Users/Shared/byb/$3.out 2>/dev/null && break; sleep 1; done
            cat /Users/Shared/byb/$3.out
            sudo ls "$home/Butler" 2>&1 | head -3
          }
          echo "=== a. standard user, launchd background job"
          job bybtest $u probe.a; il 14
          echo "=== b. standard user, launchctl asuser + sudo"
          sudo launchctl asuser $u sudo -u bybtest installer -pkg /Users/Shared/byb/Bento.pkg -target CurrentUserHomeDirectory; echo "exit $?"
          il 10; sudo ls "$h/Butler" 2>&1 | head -3
          echo "=== c. second admin, launchd background job"
          job admintwo $a probe.c; il 14
          echo "=== d. second admin, asuser + sudo"
          sudo launchctl asuser $a sudo -u admintwo installer -pkg /Users/Shared/byb/Bento.pkg -target CurrentUserHomeDirectory; echo "exit $?"
          il 10
          echo "=== e. runner, launchd gui job (control)"
          job runner $(id -u) probe.e 2>&1 | head -3
          echo "=== f. installd processes"
          ps -axo user,pid,command | grep -i installd | grep -v grep
          echo "=== g. bybtest: pkg with ownership recommended"
          sed 's/--ownership preserve/--ownership recommended/' packaging/macos/build-pkg.sh > /tmp/build-rec.sh; chmod +x /tmp/build-rec.sh
          cp /tmp/build-rec.sh packaging/macos/build-rec.sh
          packaging/macos/build-rec.sh --version v0.0.1 --out /tmp/pkr | tail -1
          pkgutil --payload-files /tmp/pkr/*.pkg 2>/dev/null | head -3
          echo "=== h. sudo -u runner -i (fresh login namespace?) for bybtest"
          sudo -u bybtest -i installer -pkg /Users/Shared/byb/Bento.pkg -target CurrentUserHomeDirectory; echo "exit $?"
          il 6
