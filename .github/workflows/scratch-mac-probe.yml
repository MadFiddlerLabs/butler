name: scratch-mac-probe
on:
  push:
    branches: [e2e/mac-standard-user]
jobs:
  probe:
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: probe
        run: |
          pw="$(openssl rand -base64 18)"
          sudo sysadminctl -addUser bybtest -fullName "BYB Test" -password "$pw" -home "/Users/byb test" >/dev/null 2>&1
          sudo createhomedir -c -u bybtest
          set -x; set +e
          u=$(id -u bybtest)
          h="/Users/byb test"
          sudo -u bybtest mkdir -p "$h/Library/LaunchAgents"
          printf '%s\n' '<?xml version="1.0" encoding="UTF-8"?>' \
            '<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">' \
            '<plist version="1.0"><dict><key>Label</key><string>com.example.probe</string>' \
            '<key>ProgramArguments</key><array><string>/bin/sh</string><string>-c</string><string>id; echo HOME=$HOME; date; security list-keychains</string></array>' \
            '<key>RunAtLoad</key><true/>' \
            '<key>StandardOutPath</key><string>/Users/byb test/probe.out</string></dict></plist>' > /tmp/probe.plist
          sudo -u bybtest cp /tmp/probe.plist "$h/Library/LaunchAgents/com.example.probe.plist"
          sudo ls -la "$h/Library/LaunchAgents"
          p="$h/Library/LaunchAgents/com.example.probe.plist"
          sudo -u bybtest launchctl bootstrap user/$u "$p"; echo "exit $?"
          sleep 2; sudo cat "$h/probe.out"
          sudo launchctl bootstrap user/$u "$p"; echo "exit $?"
          sleep 2; sudo cat "$h/probe.out"
          sudo -u bybtest launchctl kickstart -p user/$u/com.example.probe; echo "exit $?"
          sleep 2; sudo cat "$h/probe.out"
          sudo -u bybtest launchctl print user/$u/com.example.probe | grep -E "state|last exit|runs|domain"
          sudo launchctl asuser $u sudo -u bybtest launchctl bootstrap user/$u "$p"; echo "exit $?"
          # the runner's gui domain
          mkdir -p ~/Library/LaunchAgents; sed 's#/Users/byb test/probe.out#/tmp/runner-probe.out#' /tmp/probe.plist > ~/Library/LaunchAgents/com.example.probe.plist
          launchctl bootstrap gui/$(id -u) ~/Library/LaunchAgents/com.example.probe.plist; echo "exit $?"
          sleep 2; cat /tmp/runner-probe.out
          # open as the student
          sudo -u bybtest -i bash -c 'open -a Terminal /usr/bin/true; echo "open exit $?"'
          sleep 3; ps -axo user,pid,command | grep -i terminal | grep -v grep
          # installer as the student
          packaging/macos/build-pkg.sh --version v0.0.1 --out /tmp/pk | tail -1
          sudo mkdir -p /Users/Shared/byb && sudo cp /tmp/pk/*.pkg "/Users/Shared/byb/Bento.pkg" && sudo chmod -R a+rX /Users/Shared/byb
          sudo -u bybtest -H installer -pkg /Users/Shared/byb/Bento.pkg -target CurrentUserHomeDirectory; echo "installer exit $?"
          sudo ls -la "$h/Butler" | head; sudo cat "$h/Butler/logs/install.log"
          sudo find "$h/Butler" ! -user bybtest | head
