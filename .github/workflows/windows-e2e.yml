# Butler on Windows, end to end (#40), as macos-e2e does for the Mac: on a clean Windows runner,
# bootstrap.ps1 brings the pinned uv, its Python and the locked packages; the first preview
# builds a brief that sends nothing; and the Task Scheduler tasks install, run and come out.
# A second job builds the installer and installs, upgrades and uninstalls it. A third updates an
# installed Butler over the air, with signed test installers (tests/e2e/update.ps1). Two more
# do what a student does, as a new standard account, on ARM and x64: download, wizard, first
# run, `butler claude`, the schedule (standard-user), and an update through the tick
# (standard-user-update).
# No secrets: the brief leaves out the parts Claude writes, as it does before a key is stored.
name: windows-e2e

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  e2e:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Bootstrap, as a household's PC would
        run: powershell -ExecutionPolicy Bypass -File scripts\bootstrap.ps1
      - name: Again, which every update does
        run: powershell -ExecutionPolicy Bypass -File scripts\bootstrap.ps1
      - name: A new lock while Butler is running, and back again
        # As an update with new packages does, with the portal holding the old ones loaded.
        shell: pwsh
        run: |
          $before = "$((Get-Item .venv).Target)"
          if (-not $before) { throw ".venv isn't a junction" }
          # Start-Process joins its arguments with spaces, so the code goes in quotes of its own.
          $held = Start-Process .venv\Scripts\python.exe -ArgumentList '-c "import numpy, pydantic_core, markupsafe, time; time.sleep(900)"' -PassThru -WindowStyle Hidden
          Start-Sleep -Seconds 10
          if ($held.HasExited) { throw "the Python holding the packages didn't start (exit $($held.ExitCode))" }
          Copy-Item requirements.lock "$env:RUNNER_TEMP\requirements.lock"
          Add-Content requirements.lock "# a new lock, as a release brings one"
          powershell -ExecutionPolicy Bypass -File scripts\bootstrap.ps1
          if ($LASTEXITCODE -ne 0) { throw "bootstrap failed with Butler running" }
          $after = "$((Get-Item .venv).Target)"
          Write-Host "before: $before"; Write-Host "after: $after"
          if ($after -eq $before) { throw ".venv didn't move to the new lock's Python" }
          if (-not (Test-Path "$before\Scripts\python.exe")) { throw "the Python in use went away" }
          if ($held.HasExited) { throw "the running Butler stopped" }
          .venv\Scripts\python.exe -c "import numpy, pydantic_core, markupsafe"
          if ($LASTEXITCODE -ne 0) { throw "the new Python's packages don't load" }
          Copy-Item -Force "$env:RUNNER_TEMP\requirements.lock" requirements.lock
          powershell -ExecutionPolicy Bypass -File scripts\bootstrap.ps1
          if ($LASTEXITCODE -ne 0) { throw "bootstrap failed going back" }
          if ("$((Get-Item .venv).Target)" -ne $before) { throw "going back didn't return .venv to the old lock's Python" }
          if (-not (Test-Path "$after\Scripts\python.exe")) { throw "the one before it should be kept" }
          Stop-Process -Id $held.Id
          exit 0
      - name: The first preview
        shell: pwsh
        env:
          BUTLER_NO_OPEN: "1"
        run: |
          .venv\Scripts\python.exe run.py preview
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $brief = Get-ChildItem out\preview\brief-*.html | Sort-Object LastWriteTime | Select-Object -Last 1
          if (-not $brief) { throw "no brief in out\preview" }
          $html = Get-Content -Raw -Encoding utf8 $brief
          if ($html -notmatch "Johnson|Bento") { throw "the brief isn't the example household's" }
          if ($html -match "Traceback") { throw "the brief has a traceback in it" }
          Write-Host "brief: $($brief.Name), $($html.Length) characters"
      - name: The scheduled tasks install, the tick runs, and they come out again
        shell: pwsh
        run: |
          .venv\Scripts\python.exe run.py schedule install
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          schtasks /Run /TN "\Butler\tick"
          $deadline = (Get-Date).AddMinutes(5)
          while ((Get-Date) -lt $deadline) {
            $state = (schtasks /Query /TN "\Butler\tick" /FO CSV /NH | ConvertFrom-Csv -Header Folder,Next,Status).Status
            if ($state -ne "Running" -and (Test-Path logs\butler.log)) { break }
            Start-Sleep -Seconds 5
          }
          $info = schtasks /Query /TN "\Butler\tick" /V /FO LIST | Out-String
          Write-Host $info
          if ($info -notmatch "Last Result:\s+0\b") { Get-Content -ErrorAction SilentlyContinue logs\scheduled.log, logs\butler.log; throw "the tick didn't finish cleanly" }
          .venv\Scripts\python.exe run.py schedule uninstall
          schtasks /Query /TN "\Butler\tick" 2>$null
          if ($LASTEXITCODE -eq 0) { throw "the tick task is still there" }
          exit 0
      - name: Keep the logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-e2e-logs
          path: |
            logs/
            out/preview/
          if-no-files-found: ignore

  installer:
    # The installer as a household runs it, silently: into %USERPROFILE%\Butler without admin
    # rights, its own Python, named from the file; an upgrade keeps the household's files; and
    # uninstalling leaves them.
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Inno Setup 6 (the runner image has it; installed only if it doesn't)
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
          (Get-Item "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe").VersionInfo.ProductVersion
      - name: Build the installer
        run: powershell -ExecutionPolicy Bypass -File packaging\windows\build-installer.ps1 -Version v0.0.1-ci
      - name: Keep the installer for the standard-user job
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: dist/Butler-Setup.exe
          retention-days: 1
      - name: Install it as Bento, as a household would (silently here)
        shell: pwsh
        run: |
          Copy-Item dist\Butler-Setup.exe "$env:RUNNER_TEMP\Bento.exe"
          $p = Start-Process "$env:RUNNER_TEMP\Bento.exe" -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/LOG=$env:RUNNER_TEMP\install-1.txt" -Wait -PassThru
          $b = "$env:USERPROFILE\Butler"
          if ($p.ExitCode -ne 0) { Get-Content "$env:RUNNER_TEMP\install-1.txt" -Tail 40; Get-Content -ErrorAction SilentlyContinue "$b\logs\bootstrap.log"; throw "the installer exited $($p.ExitCode)" }
          if (-not (Test-Path "$b\.venv\Scripts\python.exe")) { throw "no Python in $b\.venv" }
          if ((Get-Content -Raw "$b\.butler-name").Trim() -ne "Bento") { throw "not named from the installer's filename" }
          Get-Content "$b\logs\install.log"
          if ((Get-Content -Raw "$b\logs\install.log") -notmatch "installed \(fresh\), silently") { throw "install.log doesn't say what happened" }
          if ([Environment]::GetEnvironmentVariable("Path", "User") -notlike "*$b\bin*") { throw "Butler's bin isn't on the PATH" }
          if (-not (Test-Path "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\Butler.lnk")) { throw "no Start menu shortcut" }
      - name: The window a household's install opens runs the first run
        # The silent install above opens no window, and the unit tests stand in for it. This runs
        # the step the installer runs after a household's (not silent) install, and checks the
        # window it opens is running `butler setup` and has started it (owner's test PC,
        # 28 Oct 2026: it ran "butler cmd.exe"). Then it closes that window and undoes the start.
        shell: pwsh
        run: |
          $b = "$env:USERPROFILE\Butler"
          & "$b\.venv\Scripts\python.exe" -X utf8 "$b\run.py" installed --installer "$env:RUNNER_TEMP\Bento.exe"
          Get-Content "$b\logs\install.log" -Tail 1
          $deadline = (Get-Date).AddSeconds(60)
          do {
            Start-Sleep -Seconds 1
            $setup = Get-CimInstance Win32_Process -Filter "Name = 'python.exe'" | Where-Object { $_.CommandLine -match 'run\.py" cli setup\s*$' }
          } until (($setup -and (Test-Path "$b\data\first-run-started")) -or (Get-Date) -gt $deadline)
          Get-CimInstance Win32_Process -Filter "Name = 'python.exe' or Name = 'cmd.exe'" | Format-Table ProcessId, CommandLine -AutoSize -Wrap
          if (-not $setup) { throw "the window isn't running butler setup" }
          if (-not (Test-Path "$b\data\first-run-started")) { throw "butler setup didn't start the first run within 60 seconds" }
          $window = Get-CimInstance Win32_Process -Filter "ProcessId = $($setup[0].ParentProcessId)"
          while ($window -and $window.Name -ne "cmd.exe") { $window = Get-CimInstance Win32_Process -Filter "ProcessId = $($window.ParentProcessId)" }
          if ($window) { taskkill /T /F /PID $window.ProcessId | Out-Null }
          Remove-Item "$b\data\first-run-started"
      - name: The first preview, from the installed copy
        shell: pwsh
        env:
          BUTLER_NO_OPEN: "1"
        run: |
          $b = "$env:USERPROFILE\Butler"
          & "$b\.venv\Scripts\python.exe" "$b\run.py" preview
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Get-ChildItem "$b\out\preview\brief-*.html")) { throw "no brief" }
          # The butler command, as the Start menu shortcut and a new terminal run it.
          & "$b\bin\butler.cmd" help
          if ($LASTEXITCODE -ne 0) { throw "butler.cmd help exited $LASTEXITCODE" }
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: In a real console, from a new window, as a household types
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check pywinpty==3.0.5
          python -X utf8 tests\e2e\windows_console.py "$env:USERPROFILE\Butler"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upgrading keeps the household's files
        shell: pwsh
        run: |
          $b = "$env:USERPROFILE\Butler"
          Set-Content -Encoding utf8 "$b\config\settings.yaml" "name: Bento"
          Set-Content -Encoding utf8 "$b\data\household_notes.md" "- a note"
          Copy-Item dist\Butler-Setup.exe "$env:RUNNER_TEMP\Jeeves.exe"
          $p = Start-Process "$env:RUNNER_TEMP\Jeeves.exe" -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/LOG=$env:RUNNER_TEMP\install-2.txt" -Wait -PassThru
          if ($p.ExitCode -ne 0) { Get-Content "$env:RUNNER_TEMP\install-2.txt" -Tail 40; throw "the upgrade exited $($p.ExitCode)" }
          if ((Get-Content -Raw "$b\config\settings.yaml").Trim() -ne "name: Bento") { throw "settings.yaml changed" }
          if ((Get-Content -Raw "$b\data\household_notes.md").Trim() -ne "- a note") { throw "household_notes.md changed" }
          if ((Get-Content -Raw "$b\.butler-name").Trim() -ne "Bento") { throw ".butler-name changed" }
          if ((Get-Content -Raw "$b\logs\install.log") -notmatch "installed \(finished\), silently") { throw "the upgrade wasn't seen as one over a finished first run" }
          $paths = [Environment]::GetEnvironmentVariable("Path", "User") -split ";" | Where-Object { $_ -eq "$b\bin" }
          if (@($paths).Count -ne 1) { throw "Butler's bin is on the PATH $(@($paths).Count) times" }
      - name: Uninstalling leaves the household's files
        shell: pwsh
        run: |
          $b = "$env:USERPROFILE\Butler"
          $un = Get-ChildItem "$b\.uninstall\unins*.exe" | Select-Object -First 1
          $p = Start-Process $un.FullName -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "the uninstaller exited $($p.ExitCode)" }
          Start-Sleep -Seconds 5   # the uninstaller finishes in a copy of itself
          if (Test-Path "$b\run.py") { throw "Butler's own files are still there" }
          if ((Get-Content -Raw "$b\config\settings.yaml").Trim() -ne "name: Bento") { throw "the household's settings went" }
          if ((Get-Content -Raw "$b\data\household_notes.md").Trim() -ne "- a note") { throw "the household's notes went" }

  standard-user:
    # The owner's test PC (28 Oct 2026): Windows 11, a standard account with a space in its name,
    # no admin rights, the installer double-clicked from Downloads. On ARM, as theirs is, and on x64.
    # What a student does runs as "BYB Test", a new standard account, through tests/e2e/run_as.py
    # (its own profile and environment), with two exceptions a hosted runner forces, each labelled
    # below: the wizard's pages are clicked as the runner's account (BYB Test has no desktop of its
    # own), and the tick runs as BYB Test but isn't launched by Task Scheduler (BYB Test is never
    # logged on; tests/e2e/windows-tick.ps1). The password is made here, masked, and dies with
    # the runner.
    needs: installer
    name: standard-user (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-11-arm, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      BYB_USER: BYB Test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/download-artifact@v4
        with:
          name: windows-installer
          path: C:\byb
      - name: A standard account, "BYB Test"
        shell: pwsh
        run: |
          $chars = [char[]]"abcdefghijkmnpqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ23456789"
          $pw = "Aa1!" + -join (1..24 | ForEach-Object { $chars | Get-Random })
          Write-Host "::add-mask::$pw"
          "BYB_PASSWORD=$pw" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          New-LocalUser -Name $env:BYB_USER -Password (ConvertTo-SecureString $pw -AsPlainText -Force) -PasswordNeverExpires -AccountNeverExpires | Out-Null
          Add-LocalGroupMember -Group Users -Member $env:BYB_USER
          if ((Get-LocalGroupMember Administrators).Name -contains "$env:COMPUTERNAME\$env:BYB_USER") { throw "BYB Test is an admin" }
          Copy-Item -Recurse tests C:\byb\tests
          # The account reads the installer, the test scripts and this Python, and writes its output here.
          icacls C:\byb /grant "${env:BYB_USER}:(OI)(CI)M" | Out-Null
          python -m pip install --disable-pip-version-check pywinpty==3.0.5 pywinauto==0.6.9
          icacls $env:pythonLocation /grant "${env:BYB_USER}:(OI)(CI)RX" /T /C /Q | Out-Null
          [Environment]::OSVersion.Version; $env:PROCESSOR_ARCHITECTURE
      - name: It really is the account, without admin rights
        shell: pwsh
        run: |
          python tests\e2e\run_as.py --user $env:BYB_USER --password-env BYB_PASSWORD --out C:\byb\whoami.txt -- 'whoami & echo %USERPROFILE% & whoami /groups'
          $who = Get-Content -Raw C:\byb\whoami.txt
          if ($who -notmatch "\\byb test\s") { throw "not running as BYB Test" }
          if ($who -notmatch "C:\\Users\\BYB Test") { throw "not BYB Test's own profile" }
          if ($who -match "S-1-5-32-544") { throw "BYB Test has the Administrators group" }
          if ($who -notmatch "Medium Mandatory Level") { throw "not a standard (medium) process" }
      - name: BYB Test installs from its download, "Mr Pickles (1).exe", and the installer's window opens
        # As BYB Test: the download (with the Mark of the Web), the install, and then the step the
        # installer runs after copying when it isn't silent, which opens the first run's window.
        # The wizard's pages are clicked in the next step, as the runner's account: a second account
        # gets no desktop of its own on a hosted runner, and opening a file there (ShellExecute) as
        # BYB Test hung with no window at all.
        shell: pwsh
        run: |
          $exe = "C:\byb\Mr Pickles (1).exe"
          Copy-Item C:\byb\Butler-Setup.exe $exe
          Set-Content -Path $exe -Stream Zone.Identifier -Value "[ZoneTransfer]`r`nZoneId=3`r`nHostUrl=https://buildyourbutler.com/files/Butler-latest.exe"
          python tests\e2e\run_as.py --user $env:BYB_USER --password-env BYB_PASSWORD --out C:\byb\install-out.txt --timeout 900 -- '"C:\byb\Mr Pickles (1).exe" /VERYSILENT /SUPPRESSMSGBOXES /NORESTART /LOG=C:\byb\install.txt'
          if ($LASTEXITCODE -ne 0) { Get-Content -ErrorAction SilentlyContinue C:\byb\install.txt -Tail 40; throw "the installer exited $LASTEXITCODE" }
          $b = "C:\Users\$env:BYB_USER\Butler"
          if (-not (Test-Path "$b\.venv\Scripts\python.exe")) { throw "no Python in $b\.venv" }
          if ((Get-Content -Raw "$b\.butler-name").Trim() -ne "Mr Pickles") { throw "not named from the download's filename: $(Get-Content -Raw "$b\.butler-name")" }
          python tests\e2e\run_as.py --user $env:BYB_USER --password-env BYB_PASSWORD --out C:\byb\installed.txt --timeout 120 -- '"%USERPROFILE%\Butler\.venv\Scripts\python.exe" -X utf8 "%USERPROFILE%\Butler\run.py" installed --installer "C:\byb\Mr Pickles (1).exe"'
          if ($LASTEXITCODE -ne 0) { throw "the step after installing exited $LASTEXITCODE" }
          if ((Get-Content -Raw "$b\logs\install.log") -notmatch "installed \(fresh\): opened a console with butler setup") { throw "the install didn't open the first run" }
          pwsh tests\e2e\windows-first-window.ps1 -Butler $b -User $env:BYB_USER
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: The real wizard, double-clicked and clicked through (as the runner's account)
        # tests/e2e/windows_wizard.py: "Mr Pickles (1).exe" with the Mark of the Web, opened as a
        # double-click opens it, every page clicked. No /VERYSILENT. As the runner's own account,
        # into its own profile: the one part of this job that isn't BYB Test (see the step above).
        shell: pwsh
        run: |
          python -X utf8 tests\e2e\windows_wizard.py C:\byb\Butler-Setup.exe
          if ($LASTEXITCODE -ne 0) { throw "the wizard didn't finish" }
          $b = "$env:USERPROFILE\Butler"
          if ((Get-Content -Raw "$b\.butler-name").Trim() -ne "Mr Pickles") { throw "not named from the download's filename: $(Get-Content -Raw "$b\.butler-name")" }
          Get-Content "$b\logs\install.log"
          if ((Get-Content -Raw "$b\logs\install.log") -notmatch "installed \(fresh\): opened a console with butler setup") { throw "the wizard's install didn't open the first run" }
          pwsh tests\e2e\windows-first-window.ps1 -Butler $b -User $env:USERNAME
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Butler's packages are built for this machine (win_arm64 wheels on ARM)
        shell: pwsh
        run: |
          python tests\e2e\run_as.py --user $env:BYB_USER --password-env BYB_PASSWORD --out C:\byb\arch.txt -- '"%USERPROFILE%\Butler\.venv\Scripts\python.exe" -c "import platform, sysconfig; print(platform.machine(), sysconfig.get_platform())"'
          $b = "C:\Users\$env:BYB_USER\Butler"
          $venv = "$((Get-Item "$b\.venv").Target)"
          $pyd = @(Get-ChildItem -Recurse -Filter *.pyd "$venv\Lib\site-packages" | Select-Object -ExpandProperty Name)
          $arm = @($pyd | Where-Object { $_ -match "win_arm64" }); $x64 = @($pyd | Where-Object { $_ -match "win_amd64" })
          Write-Host "compiled modules: $($pyd.Count); win_arm64: $($arm.Count); win_amd64: $($x64.Count)"
          $arch = Get-Content -Raw C:\byb\arch.txt
          if ($env:PROCESSOR_ARCHITECTURE -eq "ARM64") {
            if ($arch -notmatch "ARM64 win-arm64") { throw "Butler's Python isn't ARM64: $arch" }
            if ($x64.Count -gt 0 -or $arm.Count -eq 0) { throw "x64 wheels on ARM: $($x64 -join ', ')" }
          } elseif ($arch -notmatch "AMD64 win-amd64") { throw "Butler's Python isn't x64: $arch" }
      - name: BYB Test types into a real console
        # tests/e2e/windows_console.py, as the account: `butler` from a new window, a key typed
        # hidden into BYB Test's Credential Manager, and `butler setup`'s questions.
        shell: pwsh
        run: |
          python tests\e2e\run_as.py --user $env:BYB_USER --password-env BYB_PASSWORD --out C:\byb\console.txt --timeout 900 -- "`"$env:pythonLocation\python.exe`" -X utf8 C:\byb\tests\e2e\windows_console.py `"%USERPROFILE%\Butler`""
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: A computer without Git, as a household's is
        # The runner has Git for Windows; a student's computer doesn't. Claude Code is installed
        # and opened without it. Put back at the end, for the runner's own clean-up.
        shell: pwsh
        run: Rename-Item "$env:ProgramFiles\Git" Git.hidden
      - name: BYB Test runs butler claude for real
        # Anthropic's installer, then Claude Code's first screen, in the same window. No key, no cost.
        shell: pwsh
        run: |
          python tests\e2e\run_as.py --user $env:BYB_USER --password-env BYB_PASSWORD --out C:\byb\claude.txt --timeout 1200 -- "`"$env:pythonLocation\python.exe`" -X utf8 C:\byb\tests\e2e\windows_claude.py `"%USERPROFILE%\Butler`""
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Git back
        if: always()
        shell: pwsh
        run: if (Test-Path "$env:ProgramFiles\Git.hidden") { Rename-Item "$env:ProgramFiles\Git.hidden" Git }
      - name: BYB Test installs the schedule, and its tick runs
        # As /butler-setup inbox has Claude run it: Task Scheduler, no admin rights. Then the tick,
        # as BYB Test (tests/e2e/windows-tick.ps1 says why the runner starts it by hand).
        shell: pwsh
        run: |
          $b = "C:\Users\$env:BYB_USER\Butler"
          python tests\e2e\run_as.py --user $env:BYB_USER --password-env BYB_PASSWORD --out C:\byb\schedule.txt --cwd $b -- '.venv\Scripts\python.exe -X utf8 run.py schedule install'
          if ($LASTEXITCODE -ne 0) { throw "schedule install exited $LASTEXITCODE" }
          foreach ($name in "tick", "morning", "portal") {
            schtasks /Query /TN "\Butler\$name" | Out-Null
            if ($LASTEXITCODE -ne 0) { throw "no \Butler\$name task" }
          }
          $before = if (Test-Path "$b\logs\butler.log") { (Get-Content "$b\logs\butler.log").Count } else { 0 }
          pwsh tests\e2e\windows-tick.ps1 -User $env:BYB_USER -Out C:\byb\tick.txt
          if ($LASTEXITCODE -ne 0) { throw "the tick, as BYB Test, exited $LASTEXITCODE" }
          $lines = @(Get-Content "$b\logs\butler.log")
          if ($lines.Count -le $before) { throw "the tick wrote nothing to butler.log" }
          $lines[$before..($lines.Count - 1)] | Out-Host
          if ($lines[$before..($lines.Count - 1)] -match "Traceback|ERROR") { throw "the tick logged an error" }
      - name: BYB Test's logs
        if: always()
        shell: pwsh
        run: |
          foreach ($log in "install.log", "bootstrap.log", "setup.log", "scheduled.log", "butler.log") {
            Write-Host "== $log"; Get-Content -ErrorAction SilentlyContinue "C:\Users\$env:BYB_USER\Butler\logs\$log" -Tail 60
          }
          foreach ($out in Get-ChildItem C:\byb\*.txt) { Write-Host "== $($out.Name)"; Get-Content $out -Tail 80 }

  standard-user-update:
    # An update as a household's computer gets it: "BYB Test", a standard account, installs
    # v0.0.1, and its own scheduled tick finds v0.0.2 and installs it (tests/e2e/windows-signed-
    # update.ps1). The installers are signed by a test certificate in Butler's publisher's name.
    # Trusting that certificate machine-wide is the one admin step, done here by the runner's
    # admin: a student never does it, since a real certificate authority is already trusted.
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Inno Setup 6 (the runner image has it; installed only if it doesn't)
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
      - name: v0.0.1 and v0.0.2, signed by a test certificate the machine trusts
        shell: pwsh
        run: |
          $cert = New-SelfSignedCertificate -Type CodeSigningCert -Subject "CN=Andrew Edmond, O=Andrew Edmond" -CertStoreLocation Cert:\CurrentUser\My -NotAfter (Get-Date).AddDays(2)
          Export-Certificate -Cert $cert -FilePath "$env:RUNNER_TEMP\test.cer" | Out-Null
          Import-Certificate -FilePath "$env:RUNNER_TEMP\test.cer" -CertStoreLocation Cert:\LocalMachine\Root | Out-Null
          Import-Certificate -FilePath "$env:RUNNER_TEMP\test.cer" -CertStoreLocation Cert:\LocalMachine\TrustedPublisher | Out-Null
          foreach ($v in "v0.0.1", "v0.0.2") {
            powershell -ExecutionPolicy Bypass -File packaging\windows\build-installer.ps1 -Version $v -Out "$env:RUNNER_TEMP\$v"
            if ($LASTEXITCODE -ne 0) { throw "building $v failed" }
            $sig = Set-AuthenticodeSignature -FilePath "$env:RUNNER_TEMP\$v\Butler-Setup.exe" -Certificate $cert -HashAlgorithm SHA256
            if ($sig.Status -ne "Valid") { throw "signing $v gave $($sig.Status)" }
          }
      - name: BYB Test's Butler updates itself, through its scheduled tick
        shell: pwsh
        run: pwsh tests\e2e\windows-signed-update.ps1 -Old "$env:RUNNER_TEMP\v0.0.1\Butler-Setup.exe" -OldVersion v0.0.1 -New "$env:RUNNER_TEMP\v0.0.2\Butler-Setup.exe" -NewVersion v0.0.2

  updates:
    # Over the air, as tests/e2e/update.sh does on a Mac: an update, two rollbacks and three
    # refusals, with the real installer and the real Authenticode check.
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Inno Setup 6 (the runner image has it; installed only if it doesn't)
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
      - name: Update, roll back and refuse
        shell: pwsh
        run: |
          pwsh -File tests\e2e\update.ps1
          if ($LASTEXITCODE -ne 0) { Get-Content -ErrorAction SilentlyContinue "$env:USERPROFILE\Butler\logs\butler.log" -Tail 60; exit $LASTEXITCODE }
      - name: Keep the logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-update-logs
          path: ~/Butler/logs/
          if-no-files-found: ignore
