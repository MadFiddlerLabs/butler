# Builds the installer package students download: the universal Calendar helper, the package,
# Developer ID signing, notarization and stapling. Then the published release updates itself to
# that package, signed to signed (job signed-update), and only after that, on a tag (v*), does
# the package become a GitHub Release. Run by hand it never publishes: it uploads the package as
# a build artifact, and given a version (like v0.2.0) it also runs the signed update to it, so a
# candidate is proven before it's tagged.
#
# Without every signing secret it still builds, as Butler-unsigned.pkg, says so in the summary,
# and a tagged run publishes it only as a prerelease, so /releases/latest stays signed.
# docs/RELEASING.md says how to create the certificates and add the secrets.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Candidate version, like v0.2.0: built signed, then the update to it is tested. Blank: v0.0.0-<commit>, no update test. Never publishes."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  package:
    runs-on: macos-latest
    timeout-minutes: 60
    outputs:
      version: ${{ steps.mode.outputs.version }}
      signed: ${{ steps.mode.outputs.signed }}
      pkg: ${{ steps.build.outputs.pkg }}
    env:
      INPUT_VERSION: ${{ inputs.version }}
      INSTALLER_P12: ${{ secrets.MACOS_INSTALLER_P12_BASE64 }}
      APP_P12: ${{ secrets.MACOS_APP_P12_BASE64 }}
      P12_PASSWORD: ${{ secrets.MACOS_P12_PASSWORD }}
      API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
      API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
      TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Version and signing mode
        id: mode
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then version="$GITHUB_REF_NAME"
          elif [ -n "${INPUT_VERSION:-}" ]; then version="$INPUT_VERSION"
          else version="v0.0.0-${GITHUB_SHA::7}"; fi
          if ! [[ "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Not a version like v1.2.3: $version" >&2; exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          missing=""
          for v in INSTALLER_P12 APP_P12 P12_PASSWORD API_KEY_P8 API_KEY_ID API_ISSUER_ID TEAM_ID; do
            [ -n "${!v}" ] || missing="$missing $v"
          done
          if [ -z "$missing" ]; then
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            {
              echo "### UNSIGNED build"
              echo "Signing secrets are missing:$missing. This package is **Butler-unsigned.pkg**: macOS"
              echo "will warn before opening it. See docs/RELEASING.md."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Import the certificates into a temporary keychain
        if: steps.mode.outputs.signed == 'true'
        run: |
          kc="$RUNNER_TEMP/butler-signing.keychain-db"
          kcpass="$(uuidgen)"
          security create-keychain -p "$kcpass" "$kc"
          security set-keychain-settings -lut 21600 "$kc"
          security unlock-keychain -p "$kcpass" "$kc"
          printf '%s' "$INSTALLER_P12" | base64 --decode > "$RUNNER_TEMP/installer.p12"
          printf '%s' "$APP_P12" | base64 --decode > "$RUNNER_TEMP/app.p12"
          security import "$RUNNER_TEMP/installer.p12" -k "$kc" -P "$P12_PASSWORD" -T /usr/bin/productbuild
          security import "$RUNNER_TEMP/app.p12" -k "$kc" -P "$P12_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/installer.p12" "$RUNNER_TEMP/app.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$kcpass" "$kc" > /dev/null
          # shellcheck disable=SC2046
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
          app_id="$(security find-identity -v -p codesigning "$kc" | sed -n "s/.*\"\(Developer ID Application: .*($TEAM_ID)\)\"/\1/p" | head -n 1)"
          installer_id="$(security find-identity -v "$kc" | sed -n "s/.*\"\(Developer ID Installer: .*($TEAM_ID)\)\"/\1/p" | head -n 1)"
          [ -n "$app_id" ] || { echo "No Developer ID Application identity for team $TEAM_ID" >&2; exit 1; }
          [ -n "$installer_id" ] || { echo "No Developer ID Installer identity for team $TEAM_ID" >&2; exit 1; }
          echo "APP_IDENTITY=$app_id" >> "$GITHUB_ENV"
          echo "INSTALLER_IDENTITY=$installer_id" >> "$GITHUB_ENV"
          echo "SIGNING_KEYCHAIN=$kc" >> "$GITHUB_ENV"

      - name: The Calendar helper (universal)
        run: packaging/macos/build-helper.sh "$RUNNER_TEMP/butler-ek" "${APP_IDENTITY:-}"

      - name: The package
        id: build
        run: |
          if [ -n "${INSTALLER_IDENTITY:-}" ]; then
            pkg="$(packaging/macos/build-pkg.sh --version "$VERSION" --out dist --helper "$RUNNER_TEMP/butler-ek" --sign "$INSTALLER_IDENTITY")"
          else
            pkg="$(packaging/macos/build-pkg.sh --version "$VERSION" --out dist --helper "$RUNNER_TEMP/butler-ek")"
          fi
          echo "PKG=$pkg" >> "$GITHUB_ENV"
          echo "pkg=$(basename "$pkg")" >> "$GITHUB_OUTPUT"
          pkgutil --payload-files "$pkg" | grep -qx './Butler/bin/butler-ek'
          pkgutil --payload-files "$pkg" | grep -qx './Butler/bin/butler'

      - name: Notarize and staple
        if: steps.mode.outputs.signed == 'true'
        run: |
          printf '%s' "$API_KEY_P8" | base64 --decode > "$RUNNER_TEMP/key.p8"
          xcrun notarytool submit "$PKG" --key "$RUNNER_TEMP/key.p8" --key-id "$API_KEY_ID" \
            --issuer "$API_ISSUER_ID" --wait --timeout 30m
          rm -f "$RUNNER_TEMP/key.p8"
          xcrun stapler staple "$PKG"
          xcrun stapler validate "$PKG"
          pkgutil --check-signature "$PKG"
          spctl --assess --type install -vv "$PKG"
          echo "### Signed and notarized: $(basename "$PKG")" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: butler-pkg-${{ env.VERSION }}
          path: dist/*.pkg

      - name: Remove the temporary keychain
        if: always() && env.SIGNING_KEYCHAIN != ''
        run: security delete-keychain "$SIGNING_KEYCHAIN"

  signed-update:
    # Signed to signed, with no check relaxed: install the published release from GitHub Releases,
    # add a household's files, then let that release's own updater install this package. Tampered
    # copies must be refused first. tests/e2e/signed-update.sh has the details.
    needs: package
    if: needs.package.outputs.signed == 'true' && !startsWith(needs.package.outputs.version, 'v0.0.0-')
    runs-on: macos-latest
    timeout-minutes: 40
    env:
      NEW: ${{ needs.package.outputs.version }}
      PKG_NAME: ${{ needs.package.outputs.pkg }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: butler-pkg-${{ needs.package.outputs.version }}
          path: ${{ runner.temp }}/candidate
      - name: The release students have now
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          old="$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)"
          [ "$old" != "$NEW" ] || { echo "$NEW is already the latest release" >&2; exit 1; }
          echo "OLD=$old" >> "$GITHUB_ENV"
      - name: The published release updates itself to this package
        run: tests/e2e/signed-update.sh "$RUNNER_TEMP/candidate/$PKG_NAME" "$NEW" "$OLD"
      - name: Summary
        run: echo "### Signed to signed, $OLD updated itself to $NEW" >> "$GITHUB_STEP_SUMMARY"

  publish:
    # Tags only. A signed package is published only once signed-update has passed. An unsigned
    # one (secrets missing) goes out only as a prerelease, which students never get.
    needs: [package, signed-update]
    if: >-
      !cancelled() && github.ref_type == 'tag' && needs.package.result == 'success' &&
      (needs.signed-update.result == 'success' || needs.package.outputs.signed != 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VERSION: ${{ needs.package.outputs.version }}
      PKG: dist/${{ needs.package.outputs.pkg }}
      SIGNED: ${{ needs.package.outputs.signed }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: butler-pkg-${{ needs.package.outputs.version }}
          path: dist
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # What's new comes first: it's the annotated tag's message, written for households, and
          # its first sentences reach the brief through the website's manifest.
          ref="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$VERSION" --jq '.object.type + " " + .object.sha')"
          whatsnew=""
          if [ "${ref%% *}" = tag ]; then
            whatsnew="$(gh api "repos/$GITHUB_REPOSITORY/git/tags/${ref#* }" --jq .message)"
          fi
          download="Download Butler from https://buildyourbutler.com. This package installs into your home folder (~/Butler) and opens the guided first run."
          if [ "$SIGNED" = true ]; then
            printf '%s\n\n%s\n' "$whatsnew" "$download" | sed '/./,$!d' > notes.md
            gh release create "$VERSION" "$PKG" --repo "$GITHUB_REPOSITORY" --title "Butler $VERSION" --notes-file notes.md
          else
            gh release create "$VERSION" "$PKG" --repo "$GITHUB_REPOSITORY" --title "Butler $VERSION (unsigned)" --prerelease \
              --notes "UNSIGNED build: signing secrets were missing. $download"
          fi
