# Every push and pull request: pyflakes, shellcheck, and the unit, integration, privacy and
# contract tests (tests/), on Linux with every outside service faked. No secrets needed.
# A second job reruns the suite at awkward dates (month and year ends, DST changes). A third makes
# the README screenshots twice and checks they match (tests/test_screenshots.py).
name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: python -m pyflakes src tests scripts
      - run: git ls-files '*.sh' '*.command' bin/butler packaging/macos/scripts/postinstall | xargs shellcheck -S warning -x
      - run: python -m unittest discover tests -v
        env:
          PYTHONPATH: src

  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-screenshots.txt
      - run: python -m playwright install --with-deps chromium
      - run: python -m unittest discover -v -s tests -p test_screenshots.py
        env:
          PYTHONPATH: src
          BUTLER_SCREENSHOTS_REQUIRED: "1"
          BUTLER_SCREENSHOTS_KEEP: ${{ runner.temp }}/screenshots
      - name: Keep the images, to compare with docs/images
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: ${{ runner.temp }}/screenshots
          if-no-files-found: ignore

  dates:
    # libfaketime moves the clock for the tests and the flows they run.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        when:
          - "2026-11-01 08:00:00"   # a Sunday that's the 1st: weekly and monthly both due
          - "2026-10-25 09:00:00"   # Europe's clocks go back
          - "2027-03-28 09:00:00"   # Europe's clocks go forward
          - "2026-12-31 22:30:00"   # year end
          - "2027-02-28 08:00:00"   # end of a short month
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: sudo apt-get install -y faketime
      - run: pip install -r requirements-dev.txt
      - name: The clock really moved, in child processes too
        run: |
          want="$(echo "$WHEN" | cut -c1-10)"
          got="$(faketime -f "@$WHEN" python -c 'import subprocess, sys; print(subprocess.run([sys.executable, "-c", "import datetime; print(datetime.date.today())"], capture_output=True, text=True).stdout.strip())')"
          echo "want $want, got $got"; [ "$got" = "$want" ]
        env:
          WHEN: ${{ matrix.when }}
      - run: faketime -f "@${{ matrix.when }}" python -m unittest discover tests
        env:
          PYTHONPATH: src
          FAKETIME_DONT_FAKE_MONOTONIC: "1"
