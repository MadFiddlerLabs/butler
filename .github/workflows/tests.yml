# Unit tests and pyflakes on every push and pull request. The tests are pure Python and read
# the example config, so they run on Linux without Calendar, Keychain or network access.
name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt pyflakes
      - run: python -m pyflakes src tests scripts
      - run: python -m unittest discover tests
        env:
          PYTHONPATH: src
