# Paid, on demand only: runs every Claude call Butler makes on the invented example household
# with each candidate model, has Claude Opus 5.5 grade the outputs blind, and reports quality and
# cost per household (scripts/model_check.py). It stops before spending more than the budget,
# at most $5.00. Needs the ANTHROPIC_API_KEY repository secret; skips cleanly without it.
# Never runs on push or on a schedule.
name: model-check

on:
  workflow_dispatch:
    inputs:
      models:
        description: "Models to compare (space-separated; empty for the example's model, Sonnet 5 and Haiku 4.5)"
        default: ""
      budget:
        description: "Most to spend, in US dollars (at most 5.00)"
        default: "5.00"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install --require-hashes -r requirements.lock && pip install -r requirements-dev.txt
      # Word splitting on MODELS is intended: one argument per model. The script checks each id.
      - run: python scripts/model_check.py --budget "$BUDGET" $MODELS
        env:
          MODELS: ${{ inputs.models }}
          BUDGET: ${{ inputs.budget }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: model-check
          path: out/model-check/
          if-no-files-found: ignore
