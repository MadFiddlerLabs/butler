# Paid: persona tests. Claude agents play three students (tests/personas/personas.yaml) through
# the course as the website shows it, each on a fresh Mac or Windows runner, and each as a standard
# account with a space in its name ("BYB Test"), as most students have it. A run takes a student's
# path: the installer opened as a double-click opens it, the window the installer opens, and
# `butler claude` for real (Anthropic's installer, then Claude Code, which the harness then talks
# to through the Agent SDK). Every run draws its own choices and slips, and starts with no memory
# of any other. One report collects the findings, and what each run's path couldn't do as a
# student's does (run.json's `differences`).
#
# By hand only, on each major change: about $1-1.50 a run for Modules 0-2, and $10-12 for the
# whole course (docs/TESTING.md). Budget 0 is free: a rehearsal, where a scripted student takes the
# same path from the download into Claude Code and the daily schedule with no Claude API key at
# all, and the job fails if any of it breaks. Past Module 2, tests/personas/outside.py fakes the
# sites a student signs up for, and Butler's own Claude calls go through a relay that counts their
# cost. Needs ANTHROPIC_API_KEY (not for a rehearsal), and COURSE_READ_TOKEN: a fine-grained token
# that can only read the private website repo's contents (the organization allows no deploy keys).
name: personas

on:
  workflow_dispatch:
    inputs:
      first_module:
        description: "First module"
        default: "0"
      last_module:
        description: "Last module"
        default: "2"
      runs:
        description: "Runs per persona per computer"
        default: "1"
      budget:
        description: "Most a run may spend, in dollars (0: a free rehearsal, no Claude API)"
        default: "6"
      platforms:
        description: "Computers, space-separated: mac, windows (x64), windows-arm; both = mac windows; all = all three"
        default: "all"
      personas:
        description: "Personas to run, space-separated (empty for all)"
        default: ""
      claude_model:
        description: "The student's Claude Code model (sonnet is a Pro plan's; empty for Claude Code's default)"
        default: "sonnet"
      windows_installer:
        description: "Windows: release = the signed Butler-Setup.exe of the latest release, as students download it; build = this commit's, unsigned"
        type: choice
        options: [release, build]
        default: release

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      windows: ${{ steps.matrix.outputs.windows }}
    env:
      RUNS: ${{ inputs.runs }}
      PLATFORMS: ${{ inputs.platforms }}
      BUDGET: ${{ inputs.budget }}
      ONLY: ${{ inputs.personas }}
    steps:
      - uses: actions/checkout@v4
      - name: The runs, and the round's ceiling
        id: matrix
        run: python3 tests/personas/plan.py >> "$GITHUB_OUTPUT"
      - name: The lessons each computer's students read
        uses: actions/checkout@v4
        with:
          repository: MadFiddlerLabs/buildyourbutler.com
          token: ${{ secrets.COURSE_READ_TOKEN }}
          path: website
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Export them
        working-directory: website
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          cp ../tests/personas/lessons.mjs scripts/persona-lessons.mjs
          for p in mac windows; do
            node scripts/persona-lessons.mjs "$p" "${{ inputs.first_module }}" "${{ inputs.last_module }}" > "../lessons-$p.json"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: lessons
          path: lessons-*.json

  windows-installer:
    # The installer a Windows student downloads. By default the signed one from the latest release:
    # an unsigned build shows Windows' "Unknown Publisher" warning, which no student sees, and two
    # careful personas rightly stopped there (30 Oct 2026). `build` makes this commit's instead,
    # unsigned, once on x64: Inno Setup's installer is 32-bit, and runs on Windows on ARM too.
    needs: plan
    if: needs.plan.outputs.windows == 'true'
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: The signed installer of the latest release
        if: inputs.windows_installer != 'build'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download --repo "${{ github.repository }}" --pattern Butler-Setup.exe --dir dist
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $signature = Get-AuthenticodeSignature dist\Butler-Setup.exe
          "Signed by: $($signature.SignerCertificate.Subject) ($($signature.Status))"
          if ($signature.Status -ne 'Valid') { throw "the release's installer isn't validly signed" }
      - name: This commit's installer, unsigned
        if: inputs.windows_installer == 'build'
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
          powershell -ExecutionPolicy Bypass -File packaging\windows\build-installer.ps1 -Version v0.0.1-persona
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: dist/Butler-Setup.exe
          retention-days: 1

  run:
    needs: [plan, windows-installer]
    if: always() && needs.plan.result == 'success' && needs.windows-installer.result != 'failure' && needs.windows-installer.result != 'cancelled'
    name: ${{ matrix.persona }} on ${{ matrix.computer }} (run ${{ matrix.seed }})
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 320   # the whole course, with real waits for Butler's five-minute inbox check
    env:
      # A rehearsal (budget 0) gets no key at all, so it can't spend anything.
      ANTHROPIC_API_KEY: ${{ inputs.budget != '0' && secrets.ANTHROPIC_API_KEY || '' }}
      REHEARSE: ${{ inputs.budget == '0' && '--rehearse' || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: lessons
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          # The harness's own Python. On Windows on ARM it's x64, under Windows' emulation: the
          # Agent SDK needs cryptography, which has no ARM wheels. Butler installs its own, native
          # Python (bootstrap.ps1), and that's the one the student's path runs.
          architecture: ${{ matrix.computer == 'windows-arm' && 'x64' || '' }}
      - name: The package a student downloads (an unsigned test build)
        if: matrix.platform == 'mac'
        run: |
          pkg="$(packaging/macos/build-pkg.sh --version v0.0.1-persona --out dist | tail -n 1)"
          echo "INSTALLER=$pkg" >> "$GITHUB_ENV"
      - name: The installer a student downloads (signed from the latest release, or this commit's unsigned)
        if: matrix.platform == 'windows'
        uses: actions/download-artifact@v4
        with:
          name: windows-installer
          path: dist
      # On a Mac the run goes in the background, watched in short steps, each followed by an upload of
      # its progress: a hosted Mac that goes silent keeps no log (twice, 29 Oct 2026), but the last
      # upload shows how far the run got and how the Mac was doing (tests/personas/watch.sh).
      - name: ${{ matrix.persona }} starts the course, as the student's own standard account
        if: matrix.platform == 'mac'
        run: |
          mkdir -p persona-progress
          nohup bash -c 'tests/personas/as-student.sh persona-out -- "$@" > persona-progress/run.log 2>&1
                         echo $? > persona-progress/exit-code' bash \
            --persona "${{ matrix.persona }}" --platform mac \
            --computer "${{ matrix.computer }}" --seed "${{ matrix.seed }}" --lessons "$PWD/lessons-mac.json" \
            --installer "$INSTALLER" --budget "${{ inputs.budget }}" --claude-model "${{ inputs.claude_model }}" $REHEARSE \
            > /dev/null 2>&1 &
      - name: The next 5 minutes
        if: matrix.platform == 'mac'
        run: tests/personas/watch.sh persona-progress 5
      - uses: actions/upload-artifact@v4
        if: always() && matrix.platform == 'mac'
        with:
          name: progress-${{ matrix.persona }}-${{ matrix.computer }}-${{ matrix.seed }}
          path: persona-progress/
          overwrite: true
      - name: The next 10 minutes
        if: matrix.platform == 'mac'
        run: tests/personas/watch.sh persona-progress 10
      - uses: actions/upload-artifact@v4
        if: always() && matrix.platform == 'mac'
        with:
          name: progress-${{ matrix.persona }}-${{ matrix.computer }}-${{ matrix.seed }}
          path: persona-progress/
          overwrite: true
      - name: The next 15 minutes
        if: matrix.platform == 'mac'
        run: tests/personas/watch.sh persona-progress 15
      - uses: actions/upload-artifact@v4
        if: always() && matrix.platform == 'mac'
        with:
          name: progress-${{ matrix.persona }}-${{ matrix.computer }}-${{ matrix.seed }}
          path: persona-progress/
          overwrite: true
      - name: The next 30 minutes
        if: matrix.platform == 'mac'
        run: tests/personas/watch.sh persona-progress 30
      - uses: actions/upload-artifact@v4
        if: always() && matrix.platform == 'mac'
        with:
          name: progress-${{ matrix.persona }}-${{ matrix.computer }}-${{ matrix.seed }}
          path: persona-progress/
          overwrite: true
      - name: ${{ matrix.persona }} finishes the course
        if: matrix.platform == 'mac'
        # A rehearsal takes under half an hour; another hour means it's stuck. A paid run has the job's time.
        timeout-minutes: ${{ inputs.budget == '0' && 60 || 300 }}
        run: tests/personas/watch.sh persona-progress done
      - uses: actions/upload-artifact@v4
        if: always() && matrix.platform == 'mac'
        with:
          name: progress-${{ matrix.persona }}-${{ matrix.computer }}-${{ matrix.seed }}
          path: persona-progress/
          overwrite: true
      - name: ${{ matrix.persona }} takes the course, as the student's own standard account
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force C:\byb | Out-Null
          Copy-Item lessons-windows.json, dist\Butler-Setup.exe C:\byb\
          $arguments = @("--persona", "${{ matrix.persona }}", "--platform", "windows", "--computer", "${{ matrix.computer }}",
                         "--seed", "${{ matrix.seed }}", "--lessons", "C:\byb\lessons-windows.json",
                         "--installer", "C:\byb\Butler-Setup.exe", "--budget", "${{ inputs.budget }}",
                         "--claude-model", "${{ inputs.claude_model }}")
          if ($env:REHEARSE) { $arguments += $env:REHEARSE }
          & .\tests\personas\as-student.ps1 -Out persona-out -Arguments $arguments
          exit $LASTEXITCODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: persona-${{ matrix.persona }}-${{ matrix.computer }}-${{ matrix.seed }}
          path: persona-out/
          if-no-files-found: ignore

  report:
    needs: run
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: persona-*
          path: runs
      - name: One report
        run: |
          python3 tests/personas/report.py runs > persona-report.md
          cat persona-report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: persona-report
          path: persona-report.md
