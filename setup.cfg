[mutmut]
source_paths=src/butler
only_mutate=
    src/butler/finance.py
pytest_add_cli_args=
    -p
    no:cacheprovider
    -q
pytest_add_cli_args_test_selection=
    tests/test_finance.py
    tests/test_money_properties.py
    tests/test_money_rules.py
also_copy=
    config/
    budget/
    examples/
    helpers/
    .claude/
    README.md
    scripts/
    TERMS_VERSION
